name: Build and Publish image to Docker Hub

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build_publish_image:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4
    - name: build new Docker image
      run: docker build . --file Dockerfile --tag arminradmueller/lxmqttbridge:latest
    - name: push to Docker Hub
      run: |
           docker login -u arminradmueller -p ${{ secrets.DOCKERHUB_TOKEN }}
           docker push arminradmueller/lxmqttbridge:latest
